<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* Auth pages */
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .auth-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .auth-box h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .auth-box p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      font-family: 'Segoe UI', sans-serif;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #7c3aed;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.75rem;
    }

    .btn:hover { background: #6d28d9; }
    .btn:disabled { background: #444; cursor: not-allowed; }
    .btn.secondary {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #888;
    }
    .btn.secondary:hover { background: #1a1a1a; color: #f0f0f0; }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    /* Main app */
    .app-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .app-header h1 { font-size: 1.5rem; }

    .logout-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #888;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .logout-btn:hover { color: #f0f0f0; border-color: #444; }

    /* Snap section */
    .snap-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 3rem;
    }

    video, canvas {
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      background: #1a1a1a;
    }

    canvas { display: none; }

    #snapshot {
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      display: none;
      margin-bottom: 1rem;
    }

    .emotion-result {
      text-align: center;
      margin: 1rem 0;
    }

    .emotion-result .emoji { font-size: 3rem; }
    .emotion-result .label { font-size: 1.8rem; font-weight: 700; }
    .emotion-result .conf { color: #888; font-size: 0.9rem; }

    .reason-box {
      width: 100%;
      max-width: 400px;
      margin-top: 1rem;
    }

    .reason-box label {
      display: block;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .suggestion-box {
      width: 100%;
      max-width: 400px;
      background: #1a2a1a;
      border: 1px solid #2a3a2a;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #4ade80;
      display: none;
    }

    /* Timeline */
    .timeline-section h2 {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: #888;
    }

    .entry-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .entry-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    .entry-emoji { font-size: 1.5rem; }

    .entry-emotion {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .entry-time {
      color: #555;
      font-size: 0.8rem;
      margin-left: auto;
    }

    .entry-reason {
      color: #aaa;
      font-size: 0.88rem;
      margin-bottom: 0.75rem;
    }

    .entry-resolution {
      background: #1a2a1a;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      color: #4ade80;
      margin-bottom: 0.75rem;
    }

    .resolve-form { margin-top: 0.75rem; }

    .resolve-form label {
      font-size: 0.82rem;
      color: #666;
      display: block;
      margin-bottom: 0.4rem;
    }

    .resolve-btn {
      padding: 0.5rem 1rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .resolve-btn:hover { background: #6d28d9; }

    .empty-state {
      text-align: center;
      color: #555;
      padding: 3rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div id="page-login" class="page active">
    <div class="auth-container">
      <div class="auth-box">
        <h1>👋 Welcome back</h1>
        <p>Sign in to your mood journal</p>
        <div id="login-error" class="error-msg"></div>
        <input type="email" id="login-email" placeholder="Email" />
        <input type="password" id="login-password" placeholder="Password" />
        <button class="btn" onclick="login()">Sign in</button>
        <button class="btn secondary" onclick="showPage('page-signup')">Create account</button>
      </div>
    </div>
  </div>

  <!-- Signup Page -->
  <div id="page-signup" class="page">
    <div class="auth-container">
      <div class="auth-box">
        <h1>✨ Create account</h1>
        <p>Start tracking your mood journey</p>
        <div id="signup-error" class="error-msg"></div>
        <input type="email" id="signup-email" placeholder="Email" />
        <input type="password" id="signup-password" placeholder="Password (min 8 characters)" />
        <button class="btn" onclick="signup()">Create account</button>
        <button class="btn secondary" onclick="showPage('page-login')">Back to sign in</button>
      </div>
    </div>
  </div>

  <!-- Verify Page -->
  <div id="page-verify" class="page">
    <div class="auth-container">
      <div class="auth-box">
        <h1>📧 Check your email</h1>
        <p>Enter the verification code we sent you</p>
        <div id="verify-error" class="error-msg"></div>
        <input type="text" id="verify-code" placeholder="Verification code" />
        <button class="btn" onclick="verify()">Verify</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="page-app" class="page">
    <div class="app-container">

      <div class="app-header">
        <h1>🧠 Mood Journal</h1>
        <button class="logout-btn" onclick="logout()">Sign out</button>
      </div>

      <!-- Snap Section -->
      <div class="snap-section">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <img id="snapshot" alt="Your photo" />

        <button class="btn" id="snapBtn" onclick="snap()" style="max-width:400px; margin-top:1rem;">
          📸 How am I feeling?
        </button>

        <div id="emotion-result" class="emotion-result" style="display:none;">
          <div class="emoji" id="emoji"></div>
          <div class="label" id="emotion-label"></div>
          <div class="conf" id="confidence"></div>
        </div>

        <div id="suggestion-box" class="suggestion-box"></div>

        <div id="reason-box" class="reason-box" style="display:none;">
          <label>What's making you feel this way?</label>
          <textarea id="reason-input" placeholder="Write about how you're feeling..."></textarea>
          <button class="btn" onclick="submitSnap()" style="max-width:400px;">Get advice & save</button>
        </div>
      </div>

      <!-- Timeline -->
      <div class="timeline-section">
        <h2>Your mood history</h2>
        <div id="entries-list"><div class="empty-state">No entries yet — snap your first mood above!</div></div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = '__API_URL__';
    const USER_POOL_ID = '__COGNITO_USER_POOL_ID__';
    const CLIENT_ID = '__COGNITO_CLIENT_ID__';

    const emojiMap = {
      HAPPY: '😄', SAD: '😢', ANGRY: '😠', SURPRISED: '😲',
      DISGUSTED: '🤢', CONFUSED: '😕', CALM: '😌', FEAR: '😨'
    };

    let currentToken = null;
    let currentEntryId = null;
    let cognitoUser = null;
    let pendingEmail = null;

    const poolData = { UserPoolId: USER_POOL_ID, ClientId: CLIENT_ID };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Auth
    function signup() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const attrs = [new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })];
      userPool.signUp(email, password, attrs, null, (err, result) => {
        if (err) { showError('signup-error', err.message); return; }
        pendingEmail = email;
        cognitoUser = result.user;
        showPage('page-verify');
      });
    }

    function verify() {
      const code = document.getElementById('verify-code').value;
      cognitoUser.confirmRegistration(code, true, (err) => {
        if (err) { showError('verify-error', err.message); return; }
        showPage('page-login');
      });
    }

    function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: password });
      const user = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
      user.authenticateUser(authDetails, {
        onSuccess: (session) => {
          currentToken = session.getIdToken().getJwtToken();
          startApp();
        },
        onFailure: (err) => { showError('login-error', err.message); }
      });
    }

    function logout() {
      userPool.getCurrentUser()?.signOut();
      currentToken = null;
      showPage('page-login');
    }

    function startApp() {
      showPage('page-app');
      startCamera();
      loadEntries();
    }

    // Camera
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(() => {
          document.getElementById('snapBtn').textContent = '❌ Camera access denied';
          document.getElementById('snapBtn').disabled = true;
        });
    }

    async function snap() {
      const btn = document.getElementById('snapBtn');
      btn.disabled = true;
      btn.textContent = 'Analysing...';

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      const snapshot = document.getElementById('snapshot');
      snapshot.src = canvas.toDataURL('image/jpeg');
      snapshot.style.display = 'block';
      video.style.display = 'none';

      const base64 = canvas.toDataURL('image/jpeg').split(',')[1];
      window._pendingImage = base64;

      document.getElementById('emotion-result').style.display = 'none';
      document.getElementById('suggestion-box').style.display = 'none';
      document.getElementById('reason-box').style.display = 'block';
      document.getElementById('snapBtn').textContent = '📸 Snap again';
      document.getElementById('snapBtn').disabled = false;
      document.getElementById('reason-input').value = '';
      loadEntries();
    }

    async function submitSnap() {
      const btn = document.getElementById('snapBtn');
      const reason = document.getElementById('reason-input').value;
      const base64 = window._pendingImage;

      try {
        const res = await fetch(`${API_URL}/detect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': currentToken },
          body: JSON.stringify({ image: base64, reason: reason })
        });

        const data = await res.json();
        const emotion = data.emotion || 'UNKNOWN';
        const confidence = data.confidence || 0;
        currentEntryId = data.entryId;

        document.getElementById('emoji').textContent = emojiMap[emotion] || '🤔';
        document.getElementById('emotion-label').textContent = emotion;
        document.getElementById('confidence').textContent = `${confidence}% confidence`;
        document.getElementById('emotion-result').style.display = 'block';
        document.getElementById('reason-box').style.display = 'block';

            if (data.advice) {
          const box = document.getElementById('suggestion-box');
          box.innerHTML = '🧠 <strong>Advice for you:</strong><br><br>' + data.advice;
          box.style.display = 'block';
        }

        if (data.personalSuggestion) {
          const box = document.getElementById('suggestion-box');
          box.innerHTML += '<br><br>💜 <strong>From your history:</strong><br>' + data.personalSuggestion;
          box.style.display = 'block';
        }

      } catch (err) {
        document.getElementById('emotion-label').textContent = 'Something went wrong';
        document.getElementById('emotion-result').style.display = 'block';
      }

      btn.textContent = '📸 Snap again';
      btn.disabled = false;
    }

    async function saveReason() {
      const reason = document.getElementById('reason-input').value;
      if (!reason.trim()) return;

      await fetch(`${API_URL}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': currentToken },
        body: JSON.stringify({ entryId: currentEntryId, resolution: '', reason: reason })
      });

      document.getElementById('reason-box').style.display = 'none';
      document.getElementById('reason-input').value = '';
      loadEntries();
    }

    // Entries
    async function loadEntries() {
      try {
        const res = await fetch(`${API_URL}/entries`, {
          headers: { 'Authorization': currentToken }
        });
        const data = await res.json();
        renderEntries(data.entries || []);
      } catch (err) {
        console.error('Could not load entries', err);
      }
    }

    function renderEntries(entries) {
      const list = document.getElementById('entries-list');
      if (!entries.length) {
        list.innerHTML = '<div class="empty-state">No entries yet — snap your first mood above!</div>';
        return;
      }

      list.innerHTML = entries.map(e => {
        const date = new Date(e.timestamp).toLocaleString();
        const emoji = emojiMap[e.emotion] || '🤔';
        const resolution = e.resolved
          ? `<div class="entry-resolution">✅ What helped: ${e.resolution}</div>`
          : `<div class="resolve-form">
               <label>Feeling better? What helped?</label>
               <textarea id="res-${e.entryId}" placeholder="What improved your mood?"></textarea>
               <button class="resolve-btn" onclick="submitResolution('${e.entryId}')">Save resolution</button>
             </div>`;

        return `
          <div class="entry-card">
            <div class="entry-header">
              <span class="entry-emoji">${emoji}</span>
              <span class="entry-emotion">${e.emotion}</span>
              <span class="entry-time">${date}</span>
            </div>
            ${e.reason ? `<div class="entry-reason">"${e.reason}"</div>` : ''}
            ${resolution}
          </div>
        `;
      }).join('');
    }

    async function submitResolution(entryId) {
      const resolution = document.getElementById(`res-${entryId}`).value;
      if (!resolution.trim()) return;

      await fetch(`${API_URL}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': currentToken },
        body: JSON.stringify({ entryId, resolution })
      });

      loadEntries();
    }

    // Check if already logged in
    const existingUser = userPool.getCurrentUser();
    if (existingUser) {
      existingUser.getSession((err, session) => {
        if (!err && session.isValid()) {
          currentToken = session.getIdToken().getJwtToken();
          startApp();
        }
      });
    }
  </script>

</body>
</html>
