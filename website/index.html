<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f4f0e6;
      background-image: repeating-linear-gradient(transparent, transparent 38px, #e3ddc9 39px);
      color: #2b2622;
      font-family: 'Lora', serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* ===== Auth pages ===== */
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .auth-box {
      background: #fffdf8;
      border: 1px solid #e0d8c5;
      box-shadow: 4px 4px 0 #e3ddc9;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .auth-box h1 {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 2.4rem;
      margin-bottom: 0.25rem;
      color: #2b2622;
    }

    .auth-box p {
      color: #8a8073;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #f4f0e6;
      border: 1px solid #d8cfba;
      border-radius: 2px;
      color: #2b2622;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      font-family: 'Lora', serif;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #c97064;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background: #2b2622;
      color: #f4f0e6;
      border: none;
      border-radius: 2px;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.25rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.75rem;
      letter-spacing: 0.5px;
    }

    .btn:hover { background: #c97064; }
    .btn:disabled { background: #b8ad9a; cursor: not-allowed; }

    .btn.secondary {
      background: transparent;
      border: 1px solid #d8cfba;
      color: #8a8073;
      font-family: 'Lora', serif;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .btn.secondary:hover { background: #f4f0e6; color: #2b2622; border-color: #2b2622; }

    .error-msg {
      color: #b5614f;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    /* ===== Main app ===== */
    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 3rem 3rem 4.5rem;
      position: relative;
      min-height: 100vh;
    }

    /* red margin rule */
    .app-container::before {
      content: '';
      position: absolute;
      left: 3rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #c97064;
      opacity: 0.4;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 3rem;
    }

    @media (max-width: 860px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
      .summary-sidebar {
        order: 2;
      }
      .main-column {
        order: 1;
      }
    }

    /* ===== Summary sidebar ===== */
    .summary-sidebar {
      display: none;
    }

    .summary-sidebar.visible {
      display: block;
    }

    .summary-card {
      background: #fffdf8;
      border: 1px solid #e0d8c5;
      box-shadow: 3px 3px 0 #e3ddc9;
      padding: 1.5rem;
      position: sticky;
      top: 2rem;
    }

    .summary-card .summary-label {
      font-size: 0.78rem;
      color: #a39a8b;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.6rem;
    }

    .summary-card .summary-headline {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.7rem;
      color: #2b2622;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .summary-card .summary-headline .emotion-word {
      color: #c97064;
    }

    .summary-card .summary-body {
      font-size: 0.92rem;
      color: #5c544a;
      border-top: 1px dashed #d8cfba;
      padding-top: 1rem;
    }

    .summary-card .summary-body .summary-title {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.2rem;
      color: #6b7a5e;
      display: block;
      margin-bottom: 0.5rem;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid #2b2622;
      padding-bottom: 1rem;
    }

    .app-header h1 {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 2.6rem;
      color: #2b2622;
    }

    .app-header .date-today {
      font-size: 0.85rem;
      color: #8a8073;
      font-style: italic;
      text-align: right;
    }

    .logout-btn {
      background: none;
      border: 1px solid #b8ad9a;
      color: #6b6155;
      padding: 0.35rem 0.9rem;
      border-radius: 2px;
      font-family: 'Lora', serif;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .logout-btn:hover { color: #2b2622; border-color: #2b2622; }

    /* ===== Snap card ===== */
    .snap-card {
      background: #fffdf8;
      border: 1px solid #e0d8c5;
      box-shadow: 3px 3px 0 #e3ddc9;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    video, canvas, #snapshot {
      width: 100%;
      max-width: 380px;
      border-radius: 2px;
      margin-bottom: 1rem;
      background: #e3ddc9;
      filter: sepia(8%);
    }

    canvas { display: none; }
    #snapshot { display: none; }

    .snap-btn {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.4rem;
      background: #2b2622;
      color: #f4f0e6;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .snap-btn:hover { background: #c97064; }
    .snap-btn:disabled { background: #b8ad9a; cursor: not-allowed; }

    /* confirm row */
    .confirm-row {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #d8cfba;
      display: none;
    }

    .confirm-row .reading {
      font-size: 0.85rem;
      color: #8a8073;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.4rem;
    }

    .confirm-row .emotion {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 2.2rem;
      color: #2b2622;
    }

    .confirm-row .conf {
      font-size: 0.85rem;
      color: #a39a8b;
      margin-top: 0.2rem;
    }

    .confirm-actions {
      margin-top: 0.9rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pill-btn {
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      border: 1px solid #2b2622;
      background: transparent;
      color: #2b2622;
      cursor: pointer;
    }
    .pill-btn.yes:hover { background: #2b2622; color: #f4f0e6; }
    .pill-btn.no:hover { background: #c97064; border-color: #c97064; color: #fff; }

    /* correction picker */
    .correction-box {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed #d8cfba;
      display: none;
    }

    .correction-box .reading {
      font-size: 0.85rem;
      color: #8a8073;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.6rem;
    }

    .emotion-picks {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .emotion-pick {
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      border: 1px solid #d8cfba;
      background: #f4f0e6;
      color: #2b2622;
      cursor: pointer;
    }
    .emotion-pick:hover, .emotion-pick.selected {
      background: #2b2622;
      color: #f4f0e6;
      border-color: #2b2622;
    }

    /* reason box */
    .reason-box {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #d8cfba;
      display: none;
      text-align: left;
    }

    .reason-box label {
      display: block;
      color: #8a8073;
      font-size: 0.85rem;
      font-style: italic;
      margin-bottom: 0.5rem;
    }

    /* suggestion box */
    .suggestion-box {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #d8cfba;
      text-align: left;
      font-size: 0.92rem;
      color: #5c6f4d;
      display: none;
    }

    .suggestion-box .label {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.3rem;
      color: #6b7a5e;
      margin-bottom: 0.4rem;
      display: block;
    }

    .suggestion-box .personal {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dotted #d8e0cd;
      color: #8a8073;
      font-style: italic;
    }

    /* ===== Timeline ===== */
    .timeline-section h2 {
      font-family: 'Caveat', cursive;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #2b2622;
    }

    .entry {
      margin-bottom: 2.25rem;
      padding-left: 1.25rem;
      border-left: 2px solid #e0d8c5;
      position: relative;
    }

    .entry::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 0.4rem;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c97064;
    }

    .entry-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
    }

    .entry-emoji { font-size: 1.3rem; }

    .entry-emotion {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.5rem;
    }

    .entry-time {
      font-size: 0.78rem;
      color: #a39a8b;
      font-style: italic;
      margin-left: auto;
    }

    .entry-reason {
      font-style: italic;
      color: #5c544a;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .entry-resolution {
      font-size: 0.88rem;
      color: #6b7a5e;
      background: #f0f3e9;
      border-left: 2px solid #97a983;
      padding: 0.4rem 0.7rem;
      margin-bottom: 0.5rem;
    }

    .resolve-form { margin-top: 0.5rem; }

    .resolve-form label {
      font-size: 0.82rem;
      color: #8a8073;
      font-style: italic;
      display: block;
      margin-bottom: 0.4rem;
    }

    .resolve-btn {
      font-family: 'Lora', serif;
      padding: 0.4rem 1rem;
      background: #2b2622;
      color: #f4f0e6;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .resolve-btn:hover { background: #c97064; }

    .empty-state {
      text-align: center;
      color: #a39a8b;
      font-style: italic;
      padding: 3rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div id="page-login" class="page active">
    <div class="auth-container">
      <div class="auth-box">
        <h1>Welcome back</h1>
        <p>Sign in to your mood journal</p>
        <div id="login-error" class="error-msg"></div>
        <input type="email" id="login-email" placeholder="Email" />
        <input type="password" id="login-password" placeholder="Password" />
        <button class="btn" onclick="login()">Sign in</button>
        <button class="btn secondary" onclick="showPage('page-signup')">Create account</button>
      </div>
    </div>
  </div>

  <!-- Signup Page -->
  <div id="page-signup" class="page">
    <div class="auth-container">
      <div class="auth-box">
        <h1>New page</h1>
        <p>Start tracking your mood journey</p>
        <div id="signup-error" class="error-msg"></div>
        <input type="email" id="signup-email" placeholder="Email" />
        <input type="password" id="signup-password" placeholder="Password (min 8 characters)" />
        <button class="btn" onclick="signup()">Create account</button>
        <button class="btn secondary" onclick="showPage('page-login')">Back to sign in</button>
      </div>
    </div>
  </div>

  <!-- Verify Page -->
  <div id="page-verify" class="page">
    <div class="auth-container">
      <div class="auth-box">
        <h1>Check your email</h1>
        <p>Enter the verification code we sent you</p>
        <div id="verify-error" class="error-msg"></div>
        <input type="text" id="verify-code" placeholder="Verification code" />
        <button class="btn" onclick="verify()">Verify</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="page-app" class="page">
    <div class="app-container">

      <div class="app-header">
        <h1>Mood Journal</h1>
        <div>
          <div class="date-today" id="today-date"></div>
          <button class="logout-btn" onclick="logout()">Sign out</button>
        </div>
      </div>

      <div class="app-layout">

        <!-- Summary sidebar -->
        <div class="summary-sidebar" id="summary-sidebar">
          <div class="summary-card">
            <div class="summary-label">Looking back</div>
            <div class="summary-headline" id="summary-headline"></div>
            <div class="summary-body" id="summary-body"></div>
          </div>
        </div>

        <!-- Main column -->
        <div class="main-column">

      <!-- Snap Section -->
      <div class="snap-card">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <img id="snapshot" alt="Your photo" />

        <button class="snap-btn" id="snapBtn" onclick="snap()">
          How am I feeling?
        </button>

        <!-- Detected emotion + confirm/decline -->
        <div id="confirm-row" class="confirm-row">
          <div class="reading">We think you look</div>
          <div class="emotion" id="detected-emotion"></div>
          <div class="conf" id="detected-confidence"></div>
          <div class="confirm-actions">
            <button class="pill-btn yes" onclick="confirmEmotion(true)">Yes, that's right</button>
            <button class="pill-btn no" onclick="confirmEmotion(false)">Not quite</button>
          </div>
        </div>

        <!-- Correction picker (shown if declined) -->
        <div id="correction-box" class="correction-box">
          <div class="reading">How are you really feeling?</div>
          <div class="emotion-picks" id="emotion-picks"></div>
          <input type="text" id="custom-emotion" placeholder="Or type your own..." />
        </div>

        <!-- Reason input -->
        <div id="reason-box" class="reason-box">
          <label>What's making you feel this way?</label>
          <textarea id="reason-input" placeholder="Write about how you're feeling..."></textarea>
          <button class="btn" onclick="submitSnap()">Get advice & save</button>
        </div>

        <!-- Advice -->
        <div id="suggestion-box" class="suggestion-box"></div>
      </div>

      <!-- Timeline -->
      <div class="timeline-section">
        <h2>Recent entries</h2>
        <div id="entries-list"><div class="empty-state">No entries yet — snap your first mood above</div></div>
      </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = '__API_URL__';
    const USER_POOL_ID = '__COGNITO_USER_POOL_ID__';
    const CLIENT_ID = '__COGNITO_CLIENT_ID__';

    const emojiMap = {
      HAPPY: '😄', SAD: '😢', ANGRY: '😠', SURPRISED: '😲',
      DISGUSTED: '🤢', CONFUSED: '😕', CALM: '😌', FEAR: '😨'
    };

    const emotionOptions = ['HAPPY', 'SAD', 'ANGRY', 'SURPRISED', 'DISGUSTED', 'CONFUSED', 'CALM', 'FEAR'];

    let currentToken = null;
    let currentEntryId = null;
    let cognitoUser = null;
    let pendingEmail = null;

    // Holds the working state of the current snap until it's confirmed/saved
    let pendingDetection = null; // { emotion, confidence, base64 }
    let confirmedEmotion = null;

    const poolData = { UserPoolId: USER_POOL_ID, ClientId: CLIENT_ID };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }

    function setTodayDate() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('today-date').textContent = now.toLocaleDateString('en-GB', options);
    }

    // ===== Auth =====
    function signup() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const attrs = [new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })];
      userPool.signUp(email, password, attrs, null, (err, result) => {
        if (err) { showError('signup-error', err.message); return; }
        pendingEmail = email;
        cognitoUser = result.user;
        showPage('page-verify');
      });
    }

    function verify() {
      const code = document.getElementById('verify-code').value;
      cognitoUser.confirmRegistration(code, true, (err) => {
        if (err) { showError('verify-error', err.message); return; }
        showPage('page-login');
      });
    }

    function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: password });
      const user = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
      user.authenticateUser(authDetails, {
        onSuccess: (session) => {
          currentToken = session.getIdToken().getJwtToken();
          startApp();
        },
        onFailure: (err) => { showError('login-error', err.message); }
      });
    }

    function logout() {
      userPool.getCurrentUser()?.signOut();
      currentToken = null;
      showPage('page-login');
    }

    function startApp() {
      showPage('page-app');
      setTodayDate();
      startCamera();
      loadEntries();
      loadSummary();
      buildEmotionPicks();
    }

    async function loadSummary() {
      try {
        const res = await fetch(`${API_URL}/summary`, {
          headers: { 'Authorization': currentToken }
        });
        const data = await res.json();

        if (!data.available) return;

        const sidebar = document.getElementById('summary-sidebar');
        const emotionLabel = data.mostCommon.charAt(0) + data.mostCommon.slice(1).toLowerCase();

        document.getElementById('summary-headline').innerHTML =
          `Based on your last entries, you've been feeling <span class="emotion-word">${emotionLabel}</span> lately`;

        document.getElementById('summary-body').innerHTML =
          `<span class="summary-title">A few ideas</span>${data.suggestions}`;

        sidebar.classList.add('visible');
      } catch (err) {
        console.error('Could not load summary', err);
      }
    }

    function buildEmotionPicks() {
      const wrap = document.getElementById('emotion-picks');
      wrap.innerHTML = emotionOptions.map(em =>
        `<button class="emotion-pick" data-emotion="${em}" onclick="selectCorrection('${em}')">${emojiMap[em]} ${em}</button>`
      ).join('');
    }

    // ===== Camera =====
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(() => {
          document.getElementById('snapBtn').textContent = 'Camera access denied';
          document.getElementById('snapBtn').disabled = true;
        });
    }

    function resetSnapUI() {
      document.getElementById('confirm-row').style.display = 'none';
      document.getElementById('correction-box').style.display = 'none';
      document.getElementById('reason-box').style.display = 'none';
      document.getElementById('suggestion-box').style.display = 'none';
      document.getElementById('suggestion-box').innerHTML = '';
      document.getElementById('custom-emotion').value = '';
      document.getElementById('reason-input').value = '';
      document.querySelectorAll('.emotion-pick').forEach(b => b.classList.remove('selected'));
      confirmedEmotion = null;
    }

    async function snap() {
      const btn = document.getElementById('snapBtn');
      btn.disabled = true;
      btn.textContent = 'Looking...';

      resetSnapUI();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      const snapshot = document.getElementById('snapshot');
      const dataUrl = canvas.toDataURL('image/jpeg');
      snapshot.src = dataUrl;
      snapshot.style.display = 'block';
      video.style.display = 'none';

      const base64 = dataUrl.split(',')[1];

      try {
        const res = await fetch(`${API_URL}/detect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': currentToken },
          body: JSON.stringify({ image: base64 })
        });

        const data = await res.json();

        if (!data.emotion || data.emotion === 'No face detected') {
          document.getElementById('detected-emotion').textContent = 'No face detected';
          document.getElementById('detected-confidence').textContent = 'Try again with better lighting';
          document.getElementById('confirm-row').style.display = 'block';
          document.querySelector('.confirm-actions').style.display = 'none';
        } else {
          pendingDetection = { emotion: data.emotion, confidence: data.confidence, base64 };
          document.getElementById('detected-emotion').textContent = data.emotion.charAt(0) + data.emotion.slice(1).toLowerCase();
          document.getElementById('detected-confidence').textContent = `${data.confidence}% confidence`;
          document.querySelector('.confirm-actions').style.display = 'flex';
          document.getElementById('confirm-row').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('detected-emotion').textContent = 'Something went wrong';
        document.getElementById('confirm-row').style.display = 'block';
        document.querySelector('.confirm-actions').style.display = 'none';
      }

      btn.textContent = 'Snap again';
      btn.disabled = false;
    }

    function confirmEmotion(accepted) {
      if (accepted) {
        confirmedEmotion = pendingDetection.emotion;
        document.getElementById('correction-box').style.display = 'none';
        document.getElementById('reason-box').style.display = 'block';
      } else {
        document.getElementById('correction-box').style.display = 'block';
        document.getElementById('reason-box').style.display = 'none';
      }
    }

    function selectCorrection(emotion) {
      confirmedEmotion = emotion;
      document.getElementById('custom-emotion').value = '';
      document.querySelectorAll('.emotion-pick').forEach(b => {
        b.classList.toggle('selected', b.dataset.emotion === emotion);
      });
      document.getElementById('reason-box').style.display = 'block';
    }

    // Allow typing a custom emotion
    document.addEventListener('DOMContentLoaded', () => {
      const customInput = document.getElementById('custom-emotion');
      if (customInput) {
        customInput.addEventListener('input', () => {
          const val = customInput.value.trim();
          if (val) {
            confirmedEmotion = val.toUpperCase();
            document.querySelectorAll('.emotion-pick').forEach(b => b.classList.remove('selected'));
            document.getElementById('reason-box').style.display = 'block';
          }
        });
      }
    });

    async function submitSnap() {
      const reason = document.getElementById('reason-input').value;
      const emotionToUse = confirmedEmotion || (pendingDetection && pendingDetection.emotion);
      const confidence = pendingDetection ? pendingDetection.confidence : null;
      const base64 = pendingDetection ? pendingDetection.base64 : null;
      const wasCorrected = pendingDetection && emotionToUse !== pendingDetection.emotion;

      const saveBtn = document.querySelector('#reason-box .btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Thinking...';

      try {
        const res = await fetch(`${API_URL}/detect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': currentToken },
          body: JSON.stringify({
            image: base64,
            reason: reason,
            emotion: emotionToUse,
            confidence: confidence,
            corrected: wasCorrected
          })
        });

        const data = await res.json();
        currentEntryId = data.entryId;

        const box = document.getElementById('suggestion-box');
        box.innerHTML = '';

        if (data.advice) {
          box.innerHTML += `<span class="label">A note for you</span>${data.advice}`;
          box.style.display = 'block';
        }

        if (data.personalSuggestion) {
          box.innerHTML += `<div class="personal">${data.personalSuggestion}</div>`;
          box.style.display = 'block';
        }

        loadEntries();

      } catch (err) {
        document.getElementById('suggestion-box').innerHTML = 'Something went wrong saving this entry.';
        document.getElementById('suggestion-box').style.display = 'block';
      }

      saveBtn.disabled = false;
      saveBtn.textContent = 'Get advice & save';
    }

    // ===== Entries =====
    async function loadEntries() {
      try {
        const res = await fetch(`${API_URL}/entries`, {
          headers: { 'Authorization': currentToken }
        });
        const data = await res.json();
        renderEntries(data.entries || []);
      } catch (err) {
        console.error('Could not load entries', err);
      }
    }

    function renderEntries(entries) {
      const list = document.getElementById('entries-list');
      if (!entries.length) {
        list.innerHTML = '<div class="empty-state">No entries yet — snap your first mood above</div>';
        return;
      }

      list.innerHTML = entries.map(e => {
        const date = new Date(e.timestamp).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const emoji = emojiMap[e.emotion] || '🤔';
        const resolution = e.resolved
          ? `<div class="entry-resolution">What helped: ${e.resolution}</div>`
          : `<div class="resolve-form">
               <label>Feeling better? What helped?</label>
               <textarea id="res-${e.entryId}" placeholder="What improved your mood?"></textarea>
               <button class="resolve-btn" onclick="submitResolution('${e.entryId}')">Save</button>
             </div>`;

        return `
          <div class="entry">
            <div class="entry-header">
              <span class="entry-emoji">${emoji}</span>
              <span class="entry-emotion">${e.emotion.charAt(0) + e.emotion.slice(1).toLowerCase()}</span>
              <span class="entry-time">${date}</span>
            </div>
            ${e.reason ? `<div class="entry-reason">"${e.reason}"</div>` : ''}
            ${resolution}
          </div>
        `;
      }).join('');
    }

    async function submitResolution(entryId) {
      const resolution = document.getElementById(`res-${entryId}`).value;
      if (!resolution.trim()) return;

      await fetch(`${API_URL}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': currentToken },
        body: JSON.stringify({ entryId, resolution })
      });

      loadEntries();
    }

    // Check if already logged in
    const existingUser = userPool.getCurrentUser();
    if (existingUser) {
      existingUser.getSession((err, session) => {
        if (!err && session.isValid()) {
          currentToken = session.getIdToken().getJwtToken();
          startApp();
        }
      });
    }
  </script>

</body>
</html>
